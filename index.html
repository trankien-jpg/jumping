<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Cookie Policy & Privacy</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #0b0f17;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      touch-action: manipulation;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0b0f17;
    }

    /* Screen Shake Animation during Jumpscare */
    .shaking {
      animation: jumpscareShake 0.08s infinite alternate ease-in-out;
    }

    @keyframes jumpscareShake {
      0% { transform: translate(-12px, -8px) scale(1.08) rotate(-1deg); }
      50% { transform: translate(14px, 10px) scale(1.12) rotate(1.5deg); }
      100% { transform: translate(-10px, 12px) scale(1.07) rotate(-0.5deg); }
    }

    /* 100ms Single Flash Overlay */
    #flashOverlay {
      position: absolute;
      inset: 0;
      background-color: #ffffff;
      opacity: 0;
      pointer-events: none;
      z-index: 100;
    }

    .flash-active {
      animation: singleFlash 100ms ease-out forwards;
    }

    @keyframes singleFlash {
      0% { opacity: 0.95; }
      100% { opacity: 0; }
    }

    /* ========================================================
       COOKIE CONSENT MODAL (STEP 1)
       ======================================================== */
    #lurePanel {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(11, 15, 23, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 16px;
      z-index: 20;
      cursor: pointer;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    #cookieCard {
      position: relative;
      background: #ffffff;
      color: #0f172a;
      border-radius: 28px;
      padding: 34px 36px 36px 36px;
      width: 100%;
      max-width: 660px;
      box-shadow: 0 25px 60px -10px rgba(0, 0, 0, 0.4), 0 0 1px rgba(0, 0, 0, 0.2);
      cursor: default;
      animation: cookiePop 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cookiePop {
      0% { transform: scale(0.92) translateY(12px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    #cookieCloseBtn {
      position: absolute;
      top: 22px;
      right: 24px;
      background: transparent;
      border: none;
      padding: 8px;
      cursor: pointer;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: background-color 0.15s ease, transform 0.1s ease;
      -webkit-tap-highlight-color: transparent;
    }

    #cookieCloseBtn:hover {
      background-color: #f1f5f9;
      transform: scale(1.1);
    }

    .cookie-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .cookie-text-col {
      flex: 1;
      min-width: 0;
    }

    #cookieTitle {
      font-size: clamp(26px, 4vw, 32px);
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      line-height: 1.2;
    }

    #cookieBody {
      font-size: clamp(13px, 2.5vw, 15px);
      color: #334155;
      line-height: 1.55;
      margin-bottom: 24px;
      font-weight: 450;
      max-width: 410px;
    }

    .cookie-btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .cookie-btn {
      appearance: none;
      border: none;
      outline: none;
      font-size: 14px;
      font-weight: 700;
      padding: 12px 28px;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.15s ease, box-shadow 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .cookie-accept {
      background: #0f172a;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.25);
    }

    .cookie-accept:hover {
      background: #1e293b;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.35);
    }

    .cookie-accept:active {
      transform: translateY(1px);
    }

    .cookie-pref {
      background: #f1f5f9;
      color: #0f172a;
    }

    .cookie-pref:hover {
      background: #e2e8f0;
      transform: translateY(-1px);
    }

    .cookie-pref:active {
      transform: translateY(1px);
    }

    .cookie-img-col {
      flex-shrink: 0;
      width: clamp(130px, 24vw, 200px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cookie-heart-img {
      width: 100%;
      height: auto;
      max-height: 190px;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.1));
    }

    @media (max-width: 540px) {
      #cookieCard {
        padding: 24px 20px 24px 20px;
      }
      .cookie-content {
        flex-direction: column-reverse;
        align-items: flex-start;
        gap: 16px;
      }
      .cookie-img-col {
        width: 110px;
        align-self: center;
      }
      .cookie-btn-row {
        width: 100%;
      }
      .cookie-btn {
        flex: 1;
        text-align: center;
        padding: 12px 14px;
      }
    }

    /* Loading Spinner (Step 2) */
    #loadingSpinner {
      position: absolute;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3.5px solid rgba(255, 255, 255, 0.15);
      border-top-color: rgba(255, 255, 255, 0.85);
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Jumpscare Image Container (Step 3) */
    #jumpscareContainer {
      position: absolute;
      inset: 0;
      display: none;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      z-index: 50;
      cursor: pointer;
    }

    #scareImage {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- 100ms Flash -->
    <div id="flashOverlay"></div>

    <!-- Step 1: Cookie Consent Lure UI -->
    <div id="lurePanel">
      <div id="cookieCard">
        <button id="cookieCloseBtn" class="cookie-trigger" type="button" aria-label="Close">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>

        <div class="cookie-content">
          <div class="cookie-text-col">
            <h2 id="cookieTitle">Cookies</h2>
            <p id="cookieBody">
              We use cookies and similar technologies to help personalise content, tailor and measure ads, and provide a better experience. By clicking accept, you agree to this, as outlined in our Cookie Policy.
            </p>
            <div class="cookie-btn-row">
              <button id="acceptBtn" class="cookie-btn cookie-accept cookie-trigger" type="button">Accept</button>
              <button id="prefBtn" class="cookie-btn cookie-pref cookie-trigger" type="button">Preferences</button>
            </div>
          </div>

          <div class="cookie-img-col">
            <img src="./assets/cookie.png" alt="Cookie" class="cookie-heart-img" />
          </div>
        </div>
      </div>
    </div>

    <!-- Step 2: Subtle Loading Spinner -->
    <div id="loadingSpinner">
      <div class="spinner"></div>
    </div>

    <!-- Step 3: Jumpscare Target -->
    <div id="jumpscareContainer">
      <img id="scareImage" alt="Jumpscare" />
    </div>

    <!-- Preloaded Audio -->
    <audio id="scareAudio" preload="auto" playsinline></audio>
  </div>

  <script>
    /* ========================================================
       CẤU HÌNH TÙY CHỈNH (CONFIG)
       ======================================================== */
    const CONFIG = {
      delayMinMs: 1500,           // Thời gian chờ tối thiểu sau khi bấm (1.5s)
      delayMaxMs: 3500,           // Thời gian chờ tối đa sau khi bấm (3.5s)
      volume: 1.0,                // Âm lượng (1.0 = tối đa)
      imageSrc: './assets/scare.jpg',
      soundSrc: './assets/scare.mp3',
      cookieTitle: 'Cookies',
      cookieBody: 'We use cookies and similar technologies to help personalise content, tailor and measure ads, and provide a better experience. By clicking accept, you agree to this, as outlined in our Cookie Policy.',
      acceptBtnText: 'Accept',
      preferencesBtnText: 'Preferences'
    };
    window.CONFIG = CONFIG;

    /* ========================================================
       CÁC BIẾN & THAM CHIẾU DOM
       ======================================================== */
    const appEl = document.getElementById('app');
    const flashOverlay = document.getElementById('flashOverlay');
    const lurePanel = document.getElementById('lurePanel');
    const cookieCard = document.getElementById('cookieCard');
    const cookieTitleEl = document.getElementById('cookieTitle');
    const cookieBodyEl = document.getElementById('cookieBody');
    const acceptBtn = document.getElementById('acceptBtn');
    const prefBtn = document.getElementById('prefBtn');
    const loadingSpinner = document.getElementById('loadingSpinner');
    const jumpscareContainer = document.getElementById('jumpscareContainer');
    const scareImage = document.getElementById('scareImage');
    const scareAudio = document.getElementById('scareAudio');

    // Thiết lập nội dung ban đầu từ CONFIG
    cookieTitleEl.textContent = CONFIG.cookieTitle;
    cookieBodyEl.textContent = CONFIG.cookieBody;
    acceptBtn.textContent = CONFIG.acceptBtnText;
    prefBtn.textContent = CONFIG.preferencesBtnText;

    let audioUnlocked = false;
    let audioFallbackMode = false;
    let imageFallbackMode = false;
    let audioCtx = null;
    let fallbackBuffer = null;
    let stepTimer = null;

    /* ========================================================
       FALLBACK KHI THIẾU FILE (SVG/Canvas Image + Web Audio API)
       ======================================================== */
    function createFallbackImageURI() {
      const svg = `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
        <rect width="800" height="800" fill="#000000"/>
        <ellipse cx="400" cy="410" rx="280" ry="340" fill="#ffffff" filter="drop-shadow(0 0 40px #ff0000)"/>
        <ellipse cx="290" cy="330" rx="65" ry="85" fill="#050505"/>
        <ellipse cx="510" cy="330" rx="65" ry="85" fill="#050505"/>
        <circle cx="290" cy="330" r="14" fill="#ffffff"/>
        <circle cx="510" cy="330" r="14" fill="#ffffff"/>
        <path d="M 290 350 Q 285 450 288 470 Q 292 450 294 350 Z" fill="#880000"/>
        <path d="M 510 350 Q 506 450 509 470 Q 513 450 514 350 Z" fill="#880000"/>
        <path d="M 220 520 Q 400 720 580 520 Q 400 570 220 520 Z" fill="#000000"/>
        <polygon points="260,526 280,560 300,528" fill="#ffffff"/>
        <polygon points="310,530 330,565 350,532" fill="#ffffff"/>
        <polygon points="360,533 380,570 400,534" fill="#ffffff"/>
        <polygon points="410,534 430,570 450,533" fill="#ffffff"/>
        <polygon points="460,532 480,565 500,530" fill="#ffffff"/>
        <polygon points="510,528 530,560 550,526" fill="#ffffff"/>
        <polygon points="290,620 310,580 330,615" fill="#ffffff"/>
        <polygon points="340,630 360,585 380,625" fill="#ffffff"/>
        <polygon points="420,625 440,585 460,630" fill="#ffffff"/>
        <polygon points="470,615 490,580 510,620" fill="#ffffff"/>
      </svg>`;
      return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg.trim());
    }

    function initWebAudioFallback() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const sampleRate = audioCtx.sampleRate;
        const duration = 3.0;
        const frameCount = sampleRate * duration;
        fallbackBuffer = audioCtx.createBuffer(1, frameCount, sampleRate);
        const data = fallbackBuffer.getChannelData(0);

        for (let i = 0; i < frameCount; i++) {
          const t = i / sampleRate;
          const noise = (Math.random() * 2 - 1) * 0.45;
          const osc1 = Math.sin(2 * Math.PI * (800 + Math.sin(t * 30) * 400) * t) * 0.35;
          const osc2 = Math.sin(2 * Math.PI * (1350 + Math.cos(t * 45) * 550) * t) * 0.3;
          const osc3 = Math.sin(2 * Math.PI * (240 + t * 80) * t) * 0.25;

          let env = 1.0;
          if (t < 0.05) {
            env = t / 0.05;
          } else {
            env = Math.exp(-(t - 0.05) * 0.9);
          }
          data[i] = (noise + osc1 + osc2 + osc3) * env * CONFIG.volume;
        }
      } catch (e) {
        console.warn('Web Audio initialization:', e);
      }
    }

    function playFallbackAudio() {
      try {
        if (!audioCtx) initWebAudioFallback();
        if (!audioCtx || !fallbackBuffer) return;
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const source = audioCtx.createBufferSource();
        source.buffer = fallbackBuffer;
        const gainNode = audioCtx.createGain();
        gainNode.gain.setValueAtTime(CONFIG.volume, audioCtx.currentTime);
        source.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        source.start();
      } catch (err) {
        console.error('Lỗi phát âm thanh fallback:', err);
      }
    }

    /* ========================================================
       TẢI TRƯỚC TÀI NGUYÊN (PRELOAD)
       ======================================================== */
    const preloadImg = new Image();
    preloadImg.onload = () => {
      scareImage.src = CONFIG.imageSrc;
    };
    preloadImg.onerror = () => {
      imageFallbackMode = true;
      scareImage.src = createFallbackImageURI();
    };
    preloadImg.src = CONFIG.imageSrc;

    scareAudio.src = CONFIG.soundSrc;
    scareAudio.volume = Math.max(0, Math.min(1, CONFIG.volume));
    scareAudio.onerror = () => {
      audioFallbackMode = true;
      initWebAudioFallback();
    };

    /* ========================================================
       MỞ KHÓA ÂM THANH (USER INTERACTION UNLOCK)
       ======================================================== */
    function unlockAudio() {
      const playPromise = scareAudio.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          scareAudio.pause();
          scareAudio.currentTime = 0;
          audioUnlocked = true;
        }).catch(err => {
          console.warn('Audio unlock catch:', err);
        });
      }
      initWebAudioFallback();
    }

    /* ========================================================
       LUỒNG HOẠT ĐỘNG CHÍNH
       ======================================================== */
    function startSequence() {
      if (stepTimer) clearTimeout(stepTimer);

      // Ẩn Cookie panel
      lurePanel.classList.add('hidden');

      // Tắt jumpscare nếu đang hiện
      jumpscareContainer.style.display = 'none';
      appEl.classList.remove('shaking');
      flashOverlay.classList.remove('flash-active');

      // Hiện spinner tải nhẹ
      loadingSpinner.style.display = 'flex';

      const minDelay = Math.max(500, CONFIG.delayMinMs);
      const maxDelay = Math.max(minDelay, CONFIG.delayMaxMs);
      const randomDelay = Math.floor(Math.random() * (maxDelay - minDelay + 1)) + minDelay;

      stepTimer = setTimeout(() => {
        triggerJumpscare();
      }, randomDelay);
    }

    function triggerJumpscare() {
      loadingSpinner.style.display = 'none';

      // 1. Hiện ảnh jumpscare tràn màn hình vĩnh viễn
      jumpscareContainer.style.display = 'block';

      // 2. Rung lắc màn hình
      appEl.classList.add('shaking');

      // 3. Chớp sáng đúng 1 lần duy nhất trong 100ms
      flashOverlay.classList.remove('flash-active');
      void flashOverlay.offsetWidth;
      flashOverlay.classList.add('flash-active');

      // 4. Phát âm thanh
      if (!audioFallbackMode) {
        scareAudio.currentTime = 0;
        scareAudio.volume = Math.max(0, Math.min(1, CONFIG.volume));
        const p = scareAudio.play();
        if (p !== undefined) {
          p.catch(err => {
            playFallbackAudio();
          });
        }
      } else {
        playFallbackAudio();
      }

      // 5. Rung điện thoại
      if (navigator.vibrate) {
        try {
          navigator.vibrate([200, 100, 200]);
        } catch (e) {}
      }

      // Dừng hiệu ứng rung sau 2.5s nhưng giữ nguyên ảnh jumpscare toàn màn hình
      setTimeout(() => {
        appEl.classList.remove('shaking');
        flashOverlay.classList.remove('flash-active');
      }, 2500);
    }

    /* ========================================================
       LẮNG NGHE SỰ KIỆN CLICK (BẤM VÀO ĐÂU CŨNG DÍNH BẪY)
       ======================================================== */
    // Bấm nút Accept, Preferences hoặc nút đóng ✕
    document.querySelectorAll('.cookie-trigger').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        unlockAudio();
        startSequence();
      });
    });

    // Bấm vào bất kỳ đâu trên nền xung quanh
    lurePanel.addEventListener('click', (e) => {
      e.preventDefault();
      unlockAudio();
      startSequence();
    });

    // Chạm vào ảnh jumpscare thì hù tiếp
    jumpscareContainer.addEventListener('click', (e) => {
      e.preventDefault();
      triggerJumpscare();
    });

    // Chặn double tap zoom trên iOS Safari
    let lastTouchEnd = 0;
    document.addEventListener('touchend', (event) => {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) {
        event.preventDefault();
      }
      lastTouchEnd = now;
    }, false);
  </script>
</body>
</html>
